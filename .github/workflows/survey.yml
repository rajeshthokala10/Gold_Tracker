# One-off: count Internet Archive captures of candidate Bangalore rate pages.
name: survey
on:
  push:
    paths: [collector/survey_cdx.py, .github/workflows/survey.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: gold-collect, cancel-in-progress: false }
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python collector/survey_cdx.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add collector/samples/survey_cdx.md
          if ! git diff --cached --quiet; then git commit -m "Archive capture survey" && git pull --rebase origin main && git push; fi
